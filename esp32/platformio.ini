[env:esp32-s3-dfr1154]
; DFRobot DFR1154 — ESP32-S3R8 (N16R8: 16MB quad flash, 8MB octal PSRAM), OV3660
; FlashMode/PSRAM confirmed via DFRobot's own ci.json: FlashMode=qio, PSRAM=opi
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
lib_deps =
    esp32-camera@^2.0.4
build_flags =
    -DBOARD_HAS_PSRAM
    -I include/boards
    -include boards/dfr1154.h
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

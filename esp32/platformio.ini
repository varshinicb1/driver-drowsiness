; ESP32-S3 camera node (§17-19) — see docs/hardware.md:2 for board choice, boards/README.md for pins
[env:esp32-s3-eye]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    esp32-camera@^2.0.4
build_flags =
    -DBOARD_HAS_PSRAM
    -I include/boards
    -include boards/eye.h
    -DCORE_DEBUG_LEVEL=0

